<!doctype html><html lang="en" data-model-gallery><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Descent · Species laboratory</title><style>body{margin:0;background:#06131d;color:#dceee9;font:15px system-ui}header{flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid #21404e;display:flex;gap:24px;align-items:center}h1{font-size:22px;margin:0}p{color:#8ba8b5;margin:6px 0}select,button{background:#122a39;border:1px solid #376272;color:#ddfff2;padding:12px;border-radius:5px}canvas{display:block;width:100%;max-height:80vh;object-fit:contain}#stats{padding:10px 32px;color:#829fab;font:12px monospace}</style><header><div><h1>Species laboratory</h1><p>Retained 3D geometry · habitat-specific anatomy · articulated joints</p></div><select id="world" aria-label="World roster"></select><button id="compare">Compare worlds</button><button id="nextWorlds">Next worlds</button><button id="castes">Organic</button><button id="neutral">Neutral material</button><button id="library">Legacy anatomy</button><button id="machines">Legacy hulls</button><button id="pauseMotion">Pause motion</button></header><canvas id="gallery" width="1440" height="760"></canvas><div id="stats"></div><script src="models.js?v=56"></script><script src="boss-creatures.js?v=56"></script><script src="boss-machines.js?v=56"></script><script src="levels.js?v=56"></script><script type="module">

select.onchange=()=>{stage=campaign.find(s=>s.id===select.value);mode='world';prepare();};document.querySelector('#library').onclick=()=>{mode='library';prepare()};document.querySelector('#machines').onclick=()=>{mode='machines';prepare()};document.querySelector('#pauseMotion').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume motion':'Pause motion'};
